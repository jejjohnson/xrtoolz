[project]
name = "xrtoolz-monorepo"
version = "0.0.0"
description = "xrtoolz monorepo workspace root (not published — see packages/* for shipped libraries)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv]
# geotoolz pins pipekit to its own git rev; built from git, geotoolz-ops
# carries that pin. One URL per package for the whole resolution: ours.
override-dependencies = [
    "pipekit-ops @ git+https://github.com/jejjohnson/pipekit@pipekit-ops-v0.2.1#subdirectory=packages/pipekit-ops",
    "pipekit-array @ git+https://github.com/jejjohnson/pipekit@pipekit-ops-v0.2.1#subdirectory=packages/pipekit-array",
]

[tool.uv.sources]
xrtoolz = { workspace = true }
xrtoolz-ops = { workspace = true }
xrtoolz-products = { workspace = true }
# The Operator / Sequential / Graph composition core lives in the pipekit
# monorepo as `pipekit-ops` (import `pipekit_ops`, since pipekit 0.2.0).
# Pull it from GitHub until the first PyPI release lands; the published
# wheel metadata still carries the PyPI-flavoured `pipekit-ops>=…`
# requirement from each member's [project] table. pipekit's members point
# at each other at the same commit, so both come from the one tag
# `pipekit-ops-v0.2.1` (8e357a1, ops 0.2.1 and array 0.1.1); per-package
# tags make uv report conflicting URLs for pipekit-ops.
pipekit-ops = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-ops", tag = "pipekit-ops-v0.2.1" }
pipekit-array = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit-array", tag = "pipekit-ops-v0.2.1" }
# geoops's diagnostic difference kernels back xrops.grad (geostack OP-O7).
# Both come from one geotoolz commit for the same reason: the tag
# `geotoolz-ops-v0.18.1` (640670c) also carries geotoolz-array 0.4.1, and
# is the first release on pipekit-ops (jejjohnson/geotoolz#652).
geotoolz-ops = { git = "https://github.com/jejjohnson/geotoolz", subdirectory = "packages/geotoolz-ops", tag = "geotoolz-ops-v0.18.1" }
geotoolz-array = { git = "https://github.com/jejjohnson/geotoolz", subdirectory = "packages/geotoolz-array", tag = "geotoolz-ops-v0.18.1" }
# functax plans back the gap fills and IDW in xrops.interpolate (the
# [functax] extra of xrtoolz-ops); not on PyPI, so pinned by release tag.
functax = { git = "https://github.com/jejjohnson/functax", tag = "v0.0.6" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Workspace root ships no code; the per-package wheels live under packages/*.
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.5.1",
    # The tests exercise xrops.learn, the decomposition presets and knn/KDE
    # gridding, which need the [sklearn] extra; the published base stays
    # without it.
    "scikit-learn>=1.4",
    # tests/inference/test_jax.py exercises the JAX ModelOp adapter; JAX is
    # not an xrops dependency.
    "jax>=0.4",
    # The gap fills and IDW in xrops.interpolate run on functax, the
    # [functax] extra of xrtoolz-ops; the published base stays without it.
    "functax[jax,scipy]>=0.0.6",
    # xrtoolz test fixtures (HTTP mocks, vector IO, Zarr round-trips).
    "httpx>=0.28.1",
    "geopandas>=1.1.3",
    # Reference oracle for the xrops.geom vector↔raster bridge tests
    # (vectorize / rasterize / footprint are cross-checked against georeader).
    "georeader-spaceml>=2.3",
    "pyarrow>=24.0.0",
    "zarr>=3.1.6",
    "loguru>=0.7.3",
    # scripts/family_parity.py (the geoops/xrops family-name check, gate D1).
    "cyclopts>=3",
    # NetCDF backend for xrtoolz-products's CDS cache round-trip tests. At
    # runtime the cmems / cds extras pull this transitively via their
    # service client.
    "netcdf4>=1.6",
    # zoneinfo data so xrtoolz-products's tz-aware TimeRange tests resolve
    # named zones in minimal containers (Windows / slim Linux images lack
    # the system db).
    "tzdata>=2024.1",
    # Workspace members are dev-installed so tests can import them.
    "xrtoolz",
    "xrtoolz-ops",
    "xrtoolz-products",
]
lint = [
    "ruff>=0.15.10,<0.18",
]
typecheck = [
    "ty>=0.0.30,<0.0.96",
]
docs = [
    # mkdocstrings imports the packages to render API pages.
    "xrtoolz",
    "xrtoolz-ops",
    "xrtoolz-products",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "mkdocs-jupyter>=0.26.2",
    "jupytext>=1.19.1",
    "ipykernel>=7.2.0",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.8",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin until a fixed pymdown-extensions release ships (#38).
    "pygments>=2.19,<2.22",
]

# Root-level lint config applies to files outside packages/*; each member
# package keeps its own [tool.ruff] (ruff's nearest-pyproject discovery
# scopes per-package ignores like xrtoolz's jaxtyping F722 correctly).
[tool.ruff]
target-version = "py312"
line-length = 88
# Executed Jupyter notebooks are committed as output artefacts; don't
# lint them — they were authored-and-executed pairs and re-editing
# cell source would invalidate the inline outputs.
extend-exclude = ["docs/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
# The workspace sources live under packages/*/src, so root-level files
# (docs notebooks) need the first-party classification made explicit.
known-first-party = ["xrtoolz", "xrops", "xrproducts"]

[tool.ty.environment]
python-version = "3.12"
