[project]
name = "xrtoolz-monorepo"
version = "0.0.0"
description = "xrtoolz monorepo workspace root (not published — see packages/* for shipped libraries)."
authors = [
    {name="J. Emmanuel Johnson", email="jemanjohnson34@gmail.com"},
]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
xrtoolz = { workspace = true }
xrtoolz-core = { workspace = true }
xrtoolz-grad = { workspace = true }
xrtoolz-einx = { workspace = true }
xrtoolz-sklearn = { workspace = true }
xrtoolz-reader = { workspace = true }
# The Operator / Sequential / Graph composition core lives in the pipekit
# monorepo. Pull it from GitHub until the first PyPI release lands; the
# published wheel metadata still carries the PyPI-flavoured `pipekit>=…`
# requirement from each member's [project] table.
pipekit = { git = "https://github.com/jejjohnson/pipekit", subdirectory = "packages/pipekit" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Workspace root ships no code; the per-package wheels live under packages/*.
bypass-selection = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.5.1",
    # xrtoolz test fixtures (HTTP mocks, vector IO, Zarr round-trips).
    "httpx>=0.28.1",
    "geopandas>=1.1.3",
    "pyarrow>=24.0.0",
    "zarr>=3.1.6",
    "loguru>=0.7.3",
    # NetCDF backend for xrtoolz-reader's CDS cache round-trip tests. At
    # runtime the cmems / cds extras pull this transitively via their
    # service client.
    "netcdf4>=1.6",
    # zoneinfo data so xrtoolz-reader's tz-aware TimeRange tests resolve
    # named zones in minimal containers (Windows / slim Linux images lack
    # the system db).
    "tzdata>=2024.1",
    # Workspace members are dev-installed so tests can import them.
    "xrtoolz",
    "xrtoolz-core",
    "xrtoolz-grad",
    "xrtoolz-einx",
    "xrtoolz-sklearn",
    "xrtoolz-reader",
]
lint = [
    "ruff>=0.15.10,<0.17",
]
typecheck = [
    "ty>=0.0.30,<0.0.70",
]
docs = [
    # mkdocstrings imports the packages to render API pages.
    "xrtoolz",
    "xrtoolz-core",
    "xrtoolz-grad",
    "xrtoolz-einx",
    "xrtoolz-sklearn",
    "xrtoolz-reader",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "mkdocs-jupyter>=0.26.2",
    "jupytext>=1.19.1",
    "ipykernel>=7.2.0",
    # matplotlib + watermark used by the example notebooks during local
    # re-execution. The guarded watermark cell in each notebook no-ops
    # if the package is missing, but installing it here lets the version
    # readout actually print under `nbconvert --execute`.
    "matplotlib>=3.8",
    "watermark>=2.6.0",
    # pygments 2.20.0 dropped the None -> '' coercion for HtmlFormatter(filename=...),
    # but pymdownx.highlight 10.21.x still passes the untitled-code-block title
    # through as None. Pin until a fixed pymdown-extensions release ships (#38).
    "pygments>=2.19,<2.22",
]

# Root-level lint config applies to files outside packages/*; each member
# package keeps its own [tool.ruff] (ruff's nearest-pyproject discovery
# scopes per-package ignores like xrtoolz's jaxtyping F722 correctly).
[tool.ruff]
target-version = "py312"
line-length = 88
# Executed Jupyter notebooks are committed as output artefacts; don't
# lint them — they were authored-and-executed pairs and re-editing
# cell source would invalidate the inline outputs.
extend-exclude = ["docs/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402", "E721", "E731", "E741", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2
# The workspace sources live under packages/*/src, so root-level files
# (docs notebooks) need the first-party classification made explicit.
known-first-party = ["xrtoolz", "xrcore", "xrgrad", "xreinx", "xrsklearn", "xrreader"]

[tool.ty.environment]
python-version = "3.12"
