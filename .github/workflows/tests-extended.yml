# Extended test tiers — run MANUALLY from the Actions tab.
#
# The automatic CI workflow (ci.yml) runs only the fast tier
# (`-m "not slow and not integration"`). This workflow covers the rest:
# `slow` (subprocess isolation checks, heavy optional deps) and
# `integration` (external services / real remote data). Keeping it manual
# means heavy tests never burn CI minutes on every push.
name: Extended Tests

on:
  workflow_dispatch:
    inputs:
      marker:
        description: "Which tier to run"
        type: choice
        default: "slow or integration"
        options:
          - "slow or integration"
          - "slow"
          - "integration"

permissions:
  contents: read

jobs:
  extended:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --group dev --all-extras
      # Coverage is disabled: a marker-filtered subset can't meet the
      # per-package fail_under floors. pytest exit code 5 (nothing
      # collected for the marker) is treated as success so an empty tier
      # stays green.
      - name: Run extended tests
        run: |
          for pkg in xrtoolz-core xrtoolz-grad xrtoolz-einx xrtoolz-sklearn xrtoolz; do
            echo "--- $pkg ---"
            set +e
            (cd "packages/$pkg" && uv run pytest -v --no-cov -m "${{ inputs.marker }}")
            rc=$?
            set -e
            if [ "$rc" -eq 5 ]; then
              echo "No tests collected for marker '${{ inputs.marker }}' in $pkg — OK"
            elif [ "$rc" -ne 0 ]; then
              exit "$rc"
            fi
          done
