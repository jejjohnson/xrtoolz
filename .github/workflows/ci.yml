name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --all-packages --group dev --all-extras
      # Fast tier only. The `slow` and `integration` tiers run manually
      # via the "Extended Tests" workflow (tests-extended.yml). Each
      # package runs from its own directory so its pytest + coverage
      # config applies unchanged.
      - name: Test xrtoolz-products
        run: uv run pytest -v -m "not slow and not integration"
        working-directory: packages/xrtoolz-products
      - name: Test xrtoolz-ops
        run: uv run pytest -v -m "not slow and not integration"
        working-directory: packages/xrtoolz-ops
      - name: Test xrtoolz (umbrella)
        run: uv run pytest -v
        working-directory: packages/xrtoolz
      # Docstring examples in the scoped packages are executable and
      # doctested, so the docs cannot rot silently.
      - name: Doctests (xrops.Operator, xrops.grad)
        run: |
          (cd packages/xrtoolz-ops && uv run pytest --doctest-modules src/xrops/_src src/xrops/grad --no-cov -q)
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: packages/xrtoolz-ops/coverage.xml
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: packages/xrtoolz-ops/coverage.xml
          fail_ci_if_error: false

  dask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --group dev --all-extras
      - name: Run dask compatibility sweep
        # Focused marker job; the matrix job above owns coverage. Known
        # Tier-2/3 gaps are registered as strict xfails, so this job stays
        # green and flips automatically as each remediation lands.
        run: uv run pytest -m dask -v --no-cov
        working-directory: packages/xrtoolz-ops

  minimal-install:
    # `pip install xrtoolz-ops` with no extras: viz / metrics / ocn must import
    # without cartopy, which ships in the optional `[maps]` extra, and the
    # base must not pull JAX or scikit-learn (geostack gate B1; einx is
    # allowed, as geoops's kernels under xrops.grad need it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install xrtoolz-ops without extras
        run: uv sync --package xrtoolz-ops --no-dev
      - name: Import smoke test
        run: >-
          uv run --no-sync python -c "import importlib.util as u;
          assert u.find_spec('cartopy') is None, 'cartopy leaked into the base install';
          leaked = [m for m in ('jax', 'sklearn', 'finitediffx') if u.find_spec(m) is not None];
          assert not leaked, f'{leaked} leaked into the base install';
          import xrops.viz, xrops.viz.validation, xrops.metrics, xrops.ocn,
          xrops.interpolate, xrops.transforms, xrops.learn, xrops.utils, xrops.grad"
