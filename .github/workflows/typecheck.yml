name: Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run for its previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install typecheck dependencies
        run: uv sync --group typecheck
      - name: Typecheck xrtoolz-products
        run: uv run --group typecheck ty check src/xrproducts
        working-directory: packages/xrtoolz-products
      - name: Typecheck xrtoolz-ops
        run: uv run --group typecheck ty check src/xrops
        working-directory: packages/xrtoolz-ops
