name: Type Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Install typecheck dependencies
        run: uv sync --group typecheck
      - name: Typecheck xrtoolz-core
        run: uv run --group typecheck ty check src/xrcore
        working-directory: packages/xrtoolz-core
      - name: Typecheck xrtoolz-grad
        run: uv run --group typecheck ty check src/xrgrad
        working-directory: packages/xrtoolz-grad
      - name: Typecheck xrtoolz-einx
        run: uv run --group typecheck ty check src/xreinx
        working-directory: packages/xrtoolz-einx
      - name: Typecheck xrtoolz-sklearn
        run: uv run --group typecheck ty check src/xrsklearn
        working-directory: packages/xrtoolz-sklearn
      - name: Typecheck xrtoolz
        run: uv run --group typecheck ty check src/xrtoolz
        working-directory: packages/xrtoolz
