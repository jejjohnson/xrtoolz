site_name: xrtoolz
site_description: Composable operator library for geoprocessing Earth System Data Cubes.
site_author: J. Emmanuel Johnson
repo_url: https://github.com/jejjohnson/xrtoolz
repo_name: jejjohnson/xrtoolz

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - packages/xrtoolz-ops/src
            - packages/xrtoolz-products/src
          options:
            docstring_style: google
            docstring_section_style: table
            docstring_options:
              warn_unknown_params: false
            merge_init_into_class: true
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            members_order: source
            filters: ["!^_"]
            heading_level: 3
  - mkdocs-jupyter:
      execute: false
      ignore_h1_titles: true

# Only the pointer to geotoolz is published; the pages moved there.
exclude_docs: |
  /*
  !/index.md
  !/javascripts/

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3.2.2/es5/tex-mml-chtml.js
